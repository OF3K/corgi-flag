name: get-flag

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Download dotgit
        run: |
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/dotgit.zip ./dotgit.zip
          ls -lh ./dotgit.zip
          echo "=== ZIP CONTENTS ==="
          unzip -l ./dotgit.zip | head -100
