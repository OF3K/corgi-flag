name: aws-access

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Download Lambda code
        run: |
          echo "=== DOWNLOAD code.zip ==="
          aws s3 cp s3://codec4f26c862a321ef5/code.zip ./code.zip

          echo "=== ZIP CONTENTS ==="
          unzip -l ./code.zip

          echo "=== EXTRACT ==="
          mkdir lambda_code
          unzip -q ./code.zip -d lambda_code

          echo "=== FILES ==="
          find lambda_code -type f -maxdepth 3 -print

          echo "=== SOURCE ==="
          find lambda_code -type f -maxdepth 3 -print0 | xargs -0 -r catxt || true

      - name: Check IAM
        run: |
          echo "=== ATTACHED POLICIES ==="
          aws iam list-attached-role-policies --role-name cicdRole || true

          echo "=== INLINE POLICIES ==="
          aws iam list-role-policies --role-name cicdRole || true
