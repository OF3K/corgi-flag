name: inspect-lambda

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Inspect Lambda
        run: |
          echo "=== AWS IDENTITY ==="
          aws sts get-caller-identity

          echo "=== LAMBDA CONFIGURATION ==="
          aws lambda get-function \
            --function-name nslookupv2 \
            --query 'Configuration.{FunctionName:FunctionName,Role:Role,Runtime:Runtime,Handler:Handler,CodeSize:CodeSize,Environment:Environment}' \
            --output json

          echo "=== LAMBDA POLICY ==="
          aws lambda get-policy \
            --function-name nslookupv2 \
            --output json || true
