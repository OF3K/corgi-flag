name: get-flag

on:
  push:
    branches: [corgi]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: More recon
        run: |
          echo "=== All buckets ==="
          aws s3api list-buckets --query 'Buckets[].Name'

          echo ""
          echo "=== VPC Endpoints ==="
          aws ec2 describe-vpc-endpoints --filters "Name=vpc-id,Values=vpc-09328d3fa21dce320" --query 'VpcEndpoints[].{Id:VpcEndpointId,Service:ServiceName,Type:VpcEndpointType}' --output table || true

          echo ""
          echo "=== Security Group of Lambda ==="
          aws ec2 describe-security-groups --group-ids sg-0de9d1a2c42a08a3e --query 'SecurityGroups[].{GroupId:GroupId,Inbound:IpPermissions,Outbound:IpPermissionsEgress}' || true

          echo ""
          echo "=== Second VPC subnets ==="
          aws ec2 describe-subnets --filters "Name=vpc-id,Values=vpc-09d39837c916df970" --query 'Subnets[].{SubnetId:SubnetId,Cidr:CidrBlock,Public:MapPublicIpOnLaunch}' --output table || true
