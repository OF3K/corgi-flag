name: aws-access

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Show AWS identity
        run: |
          echo "=== AWS IDENTITY ==="
          aws sts get-caller-identity

          echo "=== AWS ENVIRONMENT ==="
          env | grep '^AWS_' | sed 's/\(AWS_ACCESS_KEY_ID=\).*/\1[REDACTED]/' | sed 's/\(AWS_SECRET_ACCESS_KEY=\).*/\1[REDACTED]/' | sed 's/\(AWS_SESSION_TOKEN=\).*/\1[REDACTED]/'

      - name: Test target bucket
        run: |
          echo "=== TARGET BUCKET ==="
          aws s3api head-bucket --bucket codec4f26c862a321ef5 || true

          echo "=== TARGET OBJECT ==="
          aws s3api head-object \
            --bucket codec4f26c862a321ef5 \
            --key flag.txt || true
