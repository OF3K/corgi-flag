name: get-flag

on:
  push:
    branches: [corgi]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Check if Lambda was updated
        run: |
          aws lambda get-function-configuration --function-name nslookupv2 --query '{CodeSize:CodeSize,LastModified:LastModified,CodeSha256:CodeSha256,RevisionId:RevisionId}'
