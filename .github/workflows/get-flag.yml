name: inspect-lambda-code

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Get Lambda code
        run: |
          echo "=== AWS IDENTITY ==="
          aws sts get-caller-identity

          echo "=== LAMBDA ROLE ==="
          aws lambda get-function \
            --function-name nslookupv2 \
            --query 'Configuration.Role' \
            --output text

          echo "=== CODE LOCATION ==="
          aws lambda get-function \
            --function-name nslookupv2 \
            --query 'Code.Location' \
            --output text > /tmp/code_url

          cat /tmp/code_url

          echo "=== DOWNLOAD LAMBDA ==="
          curl -L "$(cat /tmp/code_url)" -o /tmp/lambda.zip

          echo "=== ZIP CONTENTS ==="
          unzip -l /tmp/lambda.zip

          echo "=== SOURCE ==="
          unzip -p /tmp/lambda.zip lambda_function.py
